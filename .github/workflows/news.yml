name: News fetch

# Unattended industry-radar pipeline: fetch RSS daily, commit if anything changed.
# Cloudflare Pages rebuilds automatically on push. Free tier: ~2-3 min/day.
on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache headless Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: chrome-${{ runner.os }}-stable

      - name: Install headless Chrome
        run: |
          npx @puppeteer/browsers install chrome@stable --path ~/.cache/puppeteer
          echo "PUPPETEER_EXECUTABLE_PATH=$(find ~/.cache/puppeteer -name chrome -type f -perm -u+x | head -1)" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v4

      - name: Install deps (puppeteer-core)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch and merge news
        run: node scripts/fetch-news.mjs

      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json public/newsfeed.xml data/meta.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            git commit -m "news: auto-fetch $(date -u +%F)"
            git push
          fi
